name: CIRRCULO
options:
  bundleIdPrefix: mx.enactus
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: 5.9
    ENABLE_PREVIEWS: YES
    DEVELOPMENT_TEAM: ""

targets:
  CIRRCULO:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CIRRCULO
    resources:
      - path: CIRRCULO/Resources
    info:
      path: CIRRCULO/Info.plist
      properties:
        CFBundleDisplayName: CIRRCULO
        CFBundleIdentifier: mx.enactus.cirrculo
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchStoryboardName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "CIRRCULO necesita la cámara para clasificar residuos con IA y verificar depósitos en puntos de acopio."
        NSLocationWhenInUseUsageDescription: "CIRRCULO usa tu ubicación para mostrarte los puntos de acopio más cercanos."
        NSPhotoLibraryUsageDescription: "CIRRCULO puede guardar fotos de verificación de tus depósitos."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mx.enactus.cirrculo
        INFOPLIST_FILE: CIRRCULO/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: 5.9
